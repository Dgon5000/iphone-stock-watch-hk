name: iPhone Stock Watch (Apple Store Hong Kong)

# GitHub's half of the checks: Apple at :30 of every minute, between the server's own
# checks at :00, each answer handed to the server over SSH. Only the server sends to
# Telegram and keeps the history, so nothing arrives twice.
#
# Runs follow each other: 10 minutes into a run the next one is lined up. It waits (one
# at a time, see concurrency) and takes over as soon as this run ends, after its 5.5 hours
# or earlier if GitHub loses it. GitHub often skips the watchdog's schedule, so the chain
# must not depend on it.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: iphone-stock-watch-hk
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The branch's latest code, not the commit of when this run was lined up.
          ref: ${{ github.ref_name }}

      - name: Set up SSH to the server
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
          FEED_HOST: ${{ secrets.FEED_HOST }}
          FEED_HOST_BACKUP: ${{ secrets.FEED_HOST_BACKUP }}
          FEED_KNOWN_HOSTS: ${{ secrets.FEED_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [ -z "$FEED_SSH_KEY" ] || [ -z "$FEED_HOST" ] || [ -z "$FEED_KNOWN_HOSTS" ]; then
            echo "::error::The secrets FEED_SSH_KEY, FEED_HOST and FEED_KNOWN_HOSTS are needed (see README)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$FEED_SSH_KEY" > ~/.ssh/feed_key && printf '%s\n' "$FEED_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          # One connection for the whole run; every check is a short session over it.
          cat > ~/.ssh/config <<EOF
          Host feed
            HostName $FEED_HOST
            User stockfeed
            IdentityFile ~/.ssh/feed_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPath ~/.ssh/feed-%C
            ControlPersist 10m
          EOF
          # The standby server (FEED_KNOWN_HOSTS then lists both servers' keys) takes the
          # checks the main one does not.
          if [ -n "$FEED_HOST_BACKUP" ]; then
            sed -e '1s/^Host feed$/Host feed2/' -e "2s/HostName .*/HostName $FEED_HOST_BACKUP/" ~/.ssh/config > ~/.ssh/feed2
            cat ~/.ssh/feed2 >> ~/.ssh/config && rm ~/.ssh/feed2
          fi

      - name: Check Apple at :30 of every minute and hand each check to the server
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PART_NUMBERS: ${{ vars.PART_NUMBERS }}
          FEED_HOST_BACKUP: ${{ secrets.FEED_HOST_BACKUP }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Line up the next run once this one has worked for 10 minutes. A run that fails
          # sooner lines up nothing (GitHub ends the job and its leftovers), so a broken setup
          # cannot loop. Detached from this step's output, which GitHub would wait for.
          ( sleep 600 && gh workflow run stock-watch.yml --ref "$GITHUB_REF_NAME" && echo "The next run is lined up." ) \
            > "$RUNNER_TEMP/line-up.log" 2>&1 < /dev/null &
          backup=()
          if [ -n "$FEED_HOST_BACKUP" ]; then backup=(--backup feed2); fi
          python3 -u check_stock.py --probe feed "${backup[@]}" --every 60 --offset 30 --minutes 330

      - name: Start the next run unless it is lined up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat "$RUNNER_TEMP/line-up.log" 2>/dev/null || true
          waiting=$(gh run list --workflow stock-watch.yml --limit 10 --json status \
            --jq '[.[] | select(.status == "pending" or .status == "queued" or .status == "waiting" or .status == "requested")] | length')
          if [ "$waiting" -gt 0 ]; then
            echo "The next run is lined up already."
            exit 0
          fi
          for attempt in 1 2 3; do
            gh workflow run stock-watch.yml --ref "$GITHUB_REF_NAME" && exit 0
            sleep 20
          done
          echo "::error::Could not start the next run; the server reports GitHub's silence after 30 minutes."
          exit 1
