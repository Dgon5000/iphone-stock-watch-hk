name: iPhone Stock Watch (Apple Store Hong Kong)

on:
  schedule:
    # Every 5 minutes, GitHub's minimum. GitHub often starts scheduled runs late,
    # so each run checks several times (CHECKS_PER_RUN, CHECK_INTERVAL_SECONDS).
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-stock-watch-hk
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Apple Store Hong Kong pickup stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PART_NUMBERS: ${{ vars.PART_NUMBERS }}
          CHECKS_PER_RUN: ${{ vars.CHECKS_PER_RUN || '5' }}
          CHECK_INTERVAL_SECONDS: ${{ vars.CHECK_INTERVAL_SECONDS || '60' }}
        run: python3 -u check_stock.py

      # Runs even if the check failed, so alerts that were sent are remembered.
      - name: Save stock state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- stock_state.json)" ]; then
            echo "No state change to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_state.json
          git commit -m "Update Apple HK stock state [skip ci]"
          git push || { git pull --rebase && git push; }
