name: iPhone Stock Watch (Apple Store Hong Kong)

# GitHub's half of the checks: Apple at :30 of every minute, between the server's own
# checks at :00, each answer handed to the server over SSH. Only the server sends to
# Telegram and keeps the history, so nothing arrives twice. Near GitHub's 6-hour job
# limit the job starts the next run; the watchdog workflow restarts the chain if it breaks.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: iphone-stock-watch-hk
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up SSH to the server
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
          FEED_HOST: ${{ secrets.FEED_HOST }}
          FEED_KNOWN_HOSTS: ${{ secrets.FEED_KNOWN_HOSTS }}
        shell: bash
        run: |
          if [ -z "$FEED_SSH_KEY" ] || [ -z "$FEED_HOST" ] || [ -z "$FEED_KNOWN_HOSTS" ]; then
            echo "::error::The secrets FEED_SSH_KEY, FEED_HOST and FEED_KNOWN_HOSTS are needed (see README)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$FEED_SSH_KEY" > ~/.ssh/feed_key && printf '%s\n' "$FEED_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          # One connection for the whole run; every check is a short session over it.
          cat > ~/.ssh/config <<EOF
          Host feed
            HostName $FEED_HOST
            User stockfeed
            IdentityFile ~/.ssh/feed_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPath ~/.ssh/feed-%C
            ControlPersist 10m
          EOF

      - name: Check Apple at :30 of every minute and hand each check to the server
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PART_NUMBERS: ${{ vars.PART_NUMBERS }}
        run: python3 -u check_stock.py --probe feed --every 60 --offset 30 --minutes 330

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run stock-watch.yml --ref "$GITHUB_REF_NAME" && exit 0
            sleep 20
          done
          echo "::error::Could not start the next run; the watchdog will restart it within an hour."
          exit 1
