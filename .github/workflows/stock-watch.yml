name: iPhone Stock Watch (Apple Store Hong Kong)

# GitHub's own schedule starts runs late (often 15-20 minutes apart), so this job
# keeps running and checks every CHECK_INTERVAL_SECONDS itself. Near GitHub's
# 6-hour job limit it starts the next run; the watchdog workflow restarts the
# chain if it ever breaks.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: iphone-stock-watch-hk
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Watch Apple Store Hong Kong pickup stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PART_NUMBERS: ${{ vars.PART_NUMBERS }}
          CHECK_INTERVAL_SECONDS: ${{ vars.CHECK_INTERVAL_SECONDS || '300' }}
          RUN_MINUTES: "330"
        shell: bash
        run: |
          case "$CHECK_INTERVAL_SECONDS" in
            '' | *[!0-9]*) echo "::error::CHECK_INTERVAL_SECONDS must be a whole number of seconds."; exit 1 ;;
          esac
          if [ "$CHECK_INTERVAL_SECONDS" -lt 30 ]; then
            echo "::error::CHECK_INTERVAL_SECONDS must be at least 30."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          save_state() {
            if [ -n "$(git status --porcelain -- stock_state.json)" ]; then
              git add stock_state.json
              git commit -q -m "Update Apple HK stock state [skip ci]"
              git push -q || { git pull -q --rebase && git push -q; } || echo "::warning::Could not push the stock state; will retry after the next check."
            fi
          }

          deadline=$((SECONDS + RUN_MINUTES * 60))
          while true; do
            # Pick up files changed on GitHub (e.g. a new check_stock.py) without a restart.
            git pull -q --rebase || { git rebase --abort 2>/dev/null; true; }
            # The script reports lasting failures to Telegram itself; keep watching.
            python3 -u check_stock.py || true
            save_state
            if [ $((SECONDS + CHECK_INTERVAL_SECONDS)) -ge "$deadline" ]; then
              break
            fi
            sleep "$CHECK_INTERVAL_SECONDS"
          done

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run stock-watch.yml --ref "$GITHUB_REF_NAME" && exit 0
            sleep 20
          done
          echo "::error::Could not start the next run; the watchdog will restart it within an hour."
          exit 1
