name: Stock Watch Watchdog

# Starts iPhone Stock Watch again if it is not running, e.g. after a GitHub outage.
# On completion (success, failure, cancellation or timeout), plus a scheduled safety net.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["iPhone Stock Watch (Apple Store Hong Kong)"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: iphone-stock-watch-hk-watchdog
  cancel-in-progress: false

jobs:
  ensure-running:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out recovery code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Start iPhone Stock Watch if it is not running
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/ensure_stock_watch.py
